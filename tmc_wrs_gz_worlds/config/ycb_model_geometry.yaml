# Measured geometry for the recentred tmc_wrs_gz YCB models.
#
# Generated from the collision meshes (meshes/nontextured.stl) after the
# models were recentred, so every value is expressed about the model's own
# origin -- which now sits at the footprint centre on the base plane.
#
#   radius   Enclosing radius (m) of the whole collision mesh, handles and
#            protrusions included, about the origin. A yaw sweep over +-pi
#            stays inside this circle, so it is the clearance figure a
#            randomized-placement check needs: reject a sample landing within
#            radius + other.radius of an already-placed model.
#   body_radius
#            Only on models with a protruding grip: the radius of the body
#            alone. Informational -- the grip reaches beyond it, so never use
#            it for placement checks.
#   height   Mesh extent along z (m), base plane to highest point.
#   offset   Shift (m) baked into the model's visual/collision/inertial poses
#            to move the origin. Recorded for traceability; consumers want
#            radius and height.
#
# For round-bodied vessels with a grip (pitcher, mug, skillet, duplo), the
# origin is the body centre with the grip left out, so the origin addresses
# the visible body; only radius includes the grip. Elongated tools (hammer,
# wrench, spatula, screwdrivers) centre on their full extent.
#
# Consumers read this by MODEL NAME. world_reset_sobit_home.yaml keeps its own
# per-preset `radius:` entries because the node reads those as ROS parameters
# under world_reset.<preset>.<alias>; copy the value from here when adding a
# model to a preset.
#
# Regenerate rather than hand-editing: the numbers come from the meshes.

